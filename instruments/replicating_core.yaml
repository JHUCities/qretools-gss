# The Demographics and Work questions of this workspace, with the routing the GSS
# documentation gives: every "IF ..." filter in a question's wording became that
# question's `universe` when the bank was imported, and here each one becomes the
# condition that decides whether the question is asked.
#
# The order is the 2020 Replicating Core document's, which is the order the bank was
# imported in. No source gives the order respondents saw, and the GSS asks these items
# across several ballots and years, so this is not known to be the order of any one
# interview.
#
# What this instrument does not say, because the surface can't say it:
#   - GSS records up to three mentions of one question (RACECEN1-3, ETH1-3, OTHLANG1-2,
#     MAJOR1-2). Only the first is asked here; the others are the same question's
#     further answers, not further questions.
#   - Where the bank marks one question as a variant of another, the one it is a variant
#     of is asked: income (income16 is its 26-category version), rincome (rincom16 is
#     its 26-category version), posslq (posslqy is the Y form of a wording experiment),
#     denom (other is GSS's detailed list of the same answer), and yrsusa (mnthsusa is
#     the months part of the same answer, not an alternative to it: asking one loses the
#     other, and the surface can't say "record years and months").
#     wrkgovt1 and wrkgovt2 are both asked: the README says wrkgovt was last fielded in
#     2018 and that these two replace it. Which version of a pair GSS fields today is
#     not measured here; gss_doc carries fielded years, and that is where to settle it.
#
# Three filters, and five of the values GSS reads aloud, are questions or variables this
# workspace doesn't hold: its scope is Demographics and Work (README.md). They are
# inputs, so the routing is complete and what it depends on is named.
name: replicating_core
title: "GSS Replicating Core: Demographics and Work"
description: Who is asked each of the Demographics and Work questions, as the GSS documentation says, and the values its wording reads aloud.
# This workspace's questions, read at a release tag, as any instrument reads them. A
# change to a question reaches this instrument only after a new release, when the tag
# below is moved to it in a pull request of its own (AGENTS.md). `../` reads the
# questions as they are on your branch: use it only while writing, never on main.
uses:
  gss: JHUCities/qretools-gss@v2
inputs:
  born_in_us:
    responses:
      "1": "Yes"
      "2": "No"
    description: GSS BORN, "Were you born in this country?". GSS asks it; it is outside this workspace's scope, so citizenship and time in the US depend on it as an input.
  self_employed:
    responses:
      "1": Self-employed
      "2": Works for someone else
    description: GSS WRKSLF, "Are/were you self-employed or do/did you work for someone else?". Outside this workspace's scope; NUMEMPS follows a "self-employed" answer to it.
  earned_income:
    responses:
      "1": "Yes"
      "2": "No"
    description: GSS's filter before RINCOME, "Did you earn any income from (OCCUPATION DESCRIBED IN OCC-INDUSTRY) in (the previous year)?". Outside this workspace's scope.
  last_year:
    number: {}
    description: The year the income and work questions ask about, which GSS reads aloud as a year ("in 2021, how many weeks did you work"). Usually the year before the interview.
  degree:
    open: {}
    description: The degree GSS names when it asks about a field of study, from DEGREE, a recode this workspace leaves out.
  latino:
    open: {}
    description: The word GSS reads in the Hispanic-origin question, "Latina" to a woman and "Latino" to a man. It follows SEX, which the interviewer codes and this workspace leaves out.
  occupation:
    open: {}
    description: The occupation GSS names when it asks about earnings, from the occupation and industry questions, which this workspace leaves out.
flow:
  # Demographics
  - ask: gss.racecen1
  - ask: gss.race
  - ask: gss.eth1
  - ask: gss.hispanic
    fill:
      latino: latino
  - ask: gss.sibs
  - ask: gss.marital
  - if: gss.marital in {"1", "3", "4"}
    then:
      - ask: gss.widowed
  - if: gss.marital in {"1", "2"}
    then:
      - ask: gss.divorced
  - ask: gss.posslq
  - ask: gss.childs
  - ask: gss.agekdbrn
  - ask: gss.major1
    fill:
      degree: degree
  - ask: gss.relig
  - ask: gss.denom
  - ask: gss.jew
  - ask: gss.reliten
    fill:
      religion: label(gss.relig)
  - ask: gss.income
  - if: born_in_us = "2"
    then:
      - ask: gss.uscitzn
      - ask: gss.yrsusa
  - ask: gss.fucitzn
  - ask: gss.othlang
  - if: gss.othlang = "1"
    then:
      - ask: gss.othlang1
      - ask: gss.betrlang
      - ask: gss.spklang
  # Work
  - ask: gss.wrkstat
  - if: gss.wrkstat in {"5", "6", "7", "8"}
    then:
      - ask: gss.evwork
  - ask: gss.wrkselffam
  - ask: gss.whatslf2
  - ask: gss.wrkgovt1
  - ask: gss.wrkgovt2
  - if: self_employed = "1"
    then:
      - ask: gss.numemps
  - if: gss.wrkstat in {"1", "2"}
    then:
      - ask: gss.hrs1
  - if: gss.wrkstat = "3"
    then:
      - ask: gss.hrs2
  - ask: gss.weekswrk
    fill:
      last_year: last_year
  - ask: gss.partfull
    fill:
      last_year: last_year
  - if: earned_income = "1"
    then:
      - ask: gss.rincome
        fill:
          occupation: occupation
          last_year: last_year
  - ask: gss.localnum
  - ask: gss.wksub1
  - if: gss.wksub1 = "1"
    then:
      - ask: gss.wksubs1
  - ask: gss.wksup1
  - if: gss.wksup1 = "1"
    then:
      - ask: gss.wksups1
  - ask: gss.vetyears
