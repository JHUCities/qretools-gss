# The tools that check and build this workspace, at fixed versions: `mise install` gives
# everyone, CI included, the same ones. qretools is QREtools' npm package.
[tools]
node = "26"
# allow_low_downloads: mise refuses an npm package less than 30 days old unless it's
# allowed here. qretools is JHUCities' own. Remove it once the pinned version is 30 days old.
"npm:qretools" = { version = "2.0.0-alpha.12", allow_low_downloads = true }
