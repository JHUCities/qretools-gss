# This workspace's settings. QREtools reads them with every question, shared
# file and instrument here.

# The DDI agency everything here is published under: the registered code of
# the organization that keeps the workspace. Every DDI name (URN) it exports
# includes it, as in urn:ddi:us.jhu:... It's letters, digits and
# hyphens, in parts joined by dots, such as edu.example.dept.
# JHU (us.jhu, registered with the DDI Alliance 2026-10-19) keeps this
# import; the GSS questions are NORC's.
agency: us.jhu

# Fields every question here must have, besides name, text and intent: any
# of title, concept, universe, instruction, source and note. A question
# without one shows it as "to fill in". Remove the # at the start of these
# two lines to require a title:
#required:
#  - title

# Extra fields the questions in one folder must have. These add to the list
# above and never take a field away. Remove the # at the start of these three
# lines to require a universe in questions/example:
#required_in:
#  questions/example:
#    - universe
