# Releases this workspace at a tag, for instruments to use (`uses: JHUCities/qretools-gss@v2`).
# Run it from the Actions tab with the tag to make. It builds the default branch's last
# commit with `qretools build`, each item versioned from this repository's history, and
# tags that commit with an annotated tag whose message lists each file's version, so an
# instrument reading the tag gets the same versions without the history. Only the tag
# is pushed. A build that's refused makes no tag. A tag made by hand carries no versions:
# its questions read as version 1.
# It needs a qretools with `build --tag-message` (the first release after 2.0.0-alpha.1),
# as mise.toml pins it.
name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: The tag to make, such as v2
        required: true

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The default branch, whichever branch the run was started from.
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      # Node and the qretools npm package, as mise.toml pins them.
      - uses: jdx/mise-action@v4
      - name: Check the tag's name
        env:
          TAG: ${{ inputs.tag }}
        run: git check-ref-format "refs/tags/$TAG"
      - run: qretools build . -o dist --tag-message "$RUNNER_TEMP/tag-message.txt"
      - name: Tag the commit built, and push the tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Verbatim: git's default cleanup would drop lines starting with `#`.
          git tag -a --cleanup=verbatim -F "$RUNNER_TEMP/tag-message.txt" "$TAG" HEAD
          # Without --force, a tag that exists already is refused.
          git push origin "refs/tags/$TAG"
