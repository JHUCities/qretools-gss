name: yrsusa
title: Years lived in the United States
text: How long have you lived in the United States? If less than a year, please specify the time in months. If you have lived in the United States for more than one period during your life, what is the total number of years you have lived in the United States?
intent: Citizenship and time in the United States, as the GSS Replicating Core measures it (YEARSUSA).
concept: citizenship_status
universe: born_outside_us
number:
  min: 0
  unit: years
source: GSS YEARSUSA; GSS 2022 codebook (NORC), page 359
note: "Codebook label: How long have you lived in the United States? If less than a year, please specify the time in months. If you have lived in the United States for more than one period during your life, what is the total number of years you have lived in the United States?"
