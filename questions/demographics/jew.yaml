name: jew
title: Jewish denomination
text: Do you consider yourself Orthodox, Conservative, Reform or none of these?
intent: Religion, as the GSS Replicating Core measures it (JEW).
concept: religious_affiliation
responses:
  "1": Orthodox
  "2": Conservative
  "3": Reform
  "4": None of these
  "5": Other
source: GSS JEW; GSS 1972-2018 cumulative codebook (NORC), page 314; asked in the 2008 survey
note: "Codebook wording: IF JEWISH (RELIG=3): B. Do you consider yourself Orthodox, Conservative, Reform or none of these? (PROBE FOR EXACT DENOMINATION)"
