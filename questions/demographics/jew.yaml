name: jew
title: Jewish denomination
text: Do you consider yourself Orthodox, Conservative, Reform or none of these?
intent: Religion, as the GSS Replicating Core measures it (JEW).
concept: religious_affiliation
responses:
  "1": Orthodox
  "2": Conservative
  "3": Reform
  "4": None of These
  "5": Other
source: GSS JEW; GSS 2022 codebook (NORC), page 213
note: "Codebook label: IF JEWISH:  Do you consider yourself Orthodox, Conservative, Reform or none of these? (PROBE FOR EXACT DENOMINATION) Codebook notes: In 2008, if respondent answered RELIG=3 or OTHJEW= 1 (Yes) or 2 (Half or Part) , then JEW was asked."
