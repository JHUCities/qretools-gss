name: uscitzn
title: U.S. citizenship
text: Now we would like to ask you about U.S. citizenship. Are you…
intent: Citizenship and time in the United States, as the GSS Replicating Core measures it (USCITZN).
concept: citizenship_status
universe: born_outside_us
responses:
  "1": A U.S. citizen
  "2": Not a U.S. citizen
  "3": A U.S. citizen born in Puerto Rico, the U.S. Virgin Islands, or the Northern Marianas Islands (if volunteered)
  "4": Born outside of the US to parents who were U.S. citizens at that time (if volunteered)
source: GSS USCITZN; GSS 1972-2018 cumulative codebook (NORC), page 2954; asked in the 2008 survey
note: "Codebook wording: Now we would like to ask you about U.S. citizenship. Are you…"
