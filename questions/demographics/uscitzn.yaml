name: uscitzn
title: U.S. citizenship
text: Now we would like to ask you about U.S. citizenship. Are you…
intent: Citizenship and time in the United States, as the GSS Replicating Core measures it (USCITZN).
concept: citizenship_status
universe: born_outside_us
responses:
  "1": A U.S. citizen
  "2": Not a U.S. citizen
  "3": A U.S. citizen born in puerto rico, the U.S. virgin islands, or the northern marianas islands
  "4": Born outside of the U.S. to parents who were U.S. citizens at that time
source: GSS USCITZN; GSS 2022 codebook (NORC), page 358
note: "Codebook label: Now we would like to ask you about U.S. citizenship. Are you… Codebook notes: RESPONDENT SAYS S/HE IS 'NATURALIZED,' CODE 'A U.S. CITIZEN.' USCITZNV and USCITZNNV replace USCITZN in the 2022 GSS Cross-section web mode. This variable shows sensitivity to mode of administration. Research and interpretation done using the data should take extra care to ensure the analysis reflects actual changes in public opinion and is not unduly influenced by the change in data collection methods."
