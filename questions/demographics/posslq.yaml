name: posslq
title: Living arrangement with a partner
text: Which of these statements applies to you?
intent: Marital and partnership status, as the GSS Replicating Core measures it (POSSLQ).
concept: marital_status
responses:
  "1": I am married and living in the same household as my husband or wife
  "2": I am living as married and my partner and I together live in the same household
  "3": I have a husband or wife or steady partner, but we don't live in the same household
  "4": I don't have a steady partner
source: GSS POSSLQ; GSS 2022 codebook (NORC), page 335
note: "Codebook label: Which of these statements applies to you? Codebook notes: Card A1.2a contained responses 1-4. POSSLQ and POSSLQY are used to drive certain spouse/partner skips in the replicating core."
