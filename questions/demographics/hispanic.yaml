name: hispanic
title: Hispanic or Latino origin
text: Are you Spanish, Hispanic, or Latino/Latina? Which group are you from?
intent: Hispanic or Latino origin, as the GSS Replicating Core measures it (HISPANIC).
concept: hispanic_origin
responses:
  "1": Not Hispanic
  "2": Mexican, Mexican American, chicano/a
  "3": Puerto Rican
  "4": Cuban
  "5": Salvadorian
  "6": Guatemalan
  "7": Panamanian
  "8": Nicaraguan
  "9": Costa rican
  "10": Central American
  "11": Honduran
  "15": Dominican
  "20": Peruvian
  "21": Ecuadorian
  "22": Colombian
  "23": Venezuelan
  "24": Argentinian
  "30": Spanish
  "35": Filipino/a
  "41": South American
  "47": Hispanic
  "50": Other, not specified
source: GSS HISPANIC; GSS 2022 codebook (NORC), page 355
note: "Codebook label: Are you Spanish, Hispanic, or Latino/Latina? IF YES: Which group are you from? Codebook notes: The two questions above were asked sequentially of the respondent. Hand Card A5 was given to Latino respondents and had response options 2-4 plus 'Other Hispanic, specify.'"
