name: racecen1
title: What is r's race 1st mention
text: What is your race? Indicate one or more races that you consider yourself to be.
intent: "Race, in the GSS Replicating Core: what is r's race 1st mention (RACECEN1)."
concept: race
responses: race_census
source: GSS RACECEN1, https://gssdataexplorer.norc.org/variables/5277/vshow
note: "GSS documentation wording: What is your race? Indicate one or more races that you consider yourself to be. A. First mention As of 2024, RACECEN1 has been recoded to combine Native Hawaiian, Guamanian or Chamorro, and Samoan into the \"Other Pacific Islander\" category. This has been retroactively applied to all previous years of RACECEN1. The original RACECEN1 containing data from 2000 to 2022 has been renamed RACECEN1_0022."
