name: race
title: Race, three groups
text: What race do you consider yourself?
intent: Race, as the GSS Replicating Core measures it (RACE).
concept: race
responses:
  "1": White
  "2": Black
  "3": Other
instruction: RECORD VERBATIM AND CODE. CODE WITHOUT ASKING ONLY IF THERE IS NO DOUBT IN YOUR MIND.
source: GSS RACE; GSS 2022 codebook (NORC), page 162
note: "Codebook label: What race do you consider yourself? RECORD VERBATIM AND CODE. CODE WITHOUT ASKING ONLY IF THERE IS NO DOUBT IN YOUR MIND. Codebook notes: Prior to 2021, interviewer coded, except when asked per instructions. If planning to perform trend analysis with this variable, please consult GSS Methodological Report No. 56. RACE was replaced with RACECEN1,2,3 in 2002, but imputed for trend analysis. I"
