name: betrlang
title: Language spoken more fluently
text: Which language do you speak more fluently?
intent: Languages spoken, as the GSS Replicating Core measures it (BETRLANG).
concept: language
universe: other_language_speakers
responses:
  "1": First language mentioned
  "2": Second language mentioned
source: GSS BETRLANG; GSS 1972-2018 cumulative codebook (NORC), page 1302; asked in the 2008 survey
note: "Codebook wording: Which language do you speak more fluently?"
