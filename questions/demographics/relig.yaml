name: relig
title: Religion
text: What is your religious preference? Is it Protestant, Catholic, Jewish, some other religion, or no religion?
intent: Religion, as the GSS Replicating Core measures it (RELIG).
concept: religious_affiliation
responses:
  "1": Protestant
  "2": Catholic
  "3": Jewish
  "4": None
  "5": Other (SPECIFY RELIGION AND/OR CHURCH AND DENOMINATION)
  "6": Buddhism
  "7": Hinduism
  "8": Other Eastern Religions
  "9": Muslim/Islam
  "10": Orthodox-Christian
  "11": Christian
  "12": Native American
  "13": Inter-Nondenomenational
source: GSS RELIG; GSS 1972-2018 cumulative codebook (NORC), page 312; asked in the 2008 survey
note: "Codebook wording: What is your religious preference? Is it Protestant, Catholic, Jewish, some other religion, or no religion?"
