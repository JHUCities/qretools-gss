name: relig
title: Religion
text: What is your religious preference? Is it Protestant, Catholic, Jewish, some other religion, or no religion?
intent: Religion, as the GSS Replicating Core measures it (RELIG).
concept: religious_affiliation
responses:
  "1": Protestant
  "2": Catholic
  "3": Jewish
  "4": None
  "5": Other
  "6": Buddhism
  "7": Hinduism
  "8": Other Eastern Religions
  "9": Muslim/islam
  "10": Orthodox-Christian
  "11": Christian
  "12": Native American
  "13": Inter-nondenominational
source: GSS RELIG; GSS 2022 codebook (NORC), page 210
note: "Codebook label: What is your religious preference? Is it Protestant, Catholic, Jewish, some other religion, or no religion?"
