name: fucitzn
title: Citizenship, follow-up
text: Are you…
intent: Citizenship and time in the United States, as the GSS Replicating Core measures it (FUCITZN).
concept: citizenship_status
responses:
  "1": Currently applying for US citizenship
  "2": Planning to apply for US citizenship
  "3": Not planning to apply for US citizenship
  "4": Not eligible to become a US citizen (if volunteered)
source: GSS FUCITZN; GSS 1972-2018 cumulative codebook (NORC), page 2954; asked in the 2008 survey
note: "Codebook wording: Are you…"
