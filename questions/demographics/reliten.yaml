name: reliten
title: Strength of religion
text: Would you call yourself a strong {{religion}} or a not very strong {{religion}}?
intent: Religion, as the GSS Replicating Core measures it (RELITEN).
concept: religious_affiliation
responses:
  "1": Strong
  "2": Not very strong
  "3": Somewhat strong (Vol.)
  "4": No religion
source: GSS RELITEN; GSS 1972-2018 cumulative codebook (NORC), page 318; asked in the 2008 survey
note: "Codebook wording: ASK EVERYONE WITH ANY RELIGIOUS PREFERENCE NAMED IN RELIG Would you call yourself a strong (PREFERENCE NAMED IN RELIG) or a not very strong (PREFERENCE NAMED IN RELIG)?"
fills:
  religion: text
