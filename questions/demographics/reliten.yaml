name: reliten
title: Strength of religion
text: Would you call yourself a strong {{religion}} or a not very strong {{religion}}?
intent: Religion, as the GSS Replicating Core measures it (RELITEN).
concept: religious_affiliation
responses:
  "1": Strong
  "2": Not very strong
  "3": Somewhat strong
  "4": No religion
source: GSS RELITEN; GSS 2022 codebook (NORC), page 215
note: "Codebook label: (ASK EVERYONE WITH ANY RELIGIOUS PREFERENCE NAMED IN RELIG) Would you call yourself a strong (PREFERENCE NAMED IN RELIG) or a not very strong (PREFERENCE NAMED IN RELIG)? Codebook notes: RELITENV and RELITENNV replace RELITEN in the 2022 GSS Cross-section web mode. This variable shows sensitivity to mode of administration. Research and interpretation done using the data should take extra care to ensure the analysis reflects actual changes in public opinion and is not unduly influenced by the change in data collection methods."
fills:
  religion: text
