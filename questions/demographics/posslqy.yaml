name: posslqy
title: Living arrangement with a partner, Y wording
text: Which of these statements applies to you?
intent: Marital and partnership status, as the GSS Replicating Core measures it (POSSLQY).
concept: marital_status
responses:
  "1": I am married and living in the same household as my husband or wife
  "2": I am living as married and my partner and I together live in the same household
  "3": I have a husband or wife or steady partner, but we don't live in the same household
  "4": I don't have a steady partner
source: GSS POSSLQY; GSS 2022 codebook (NORC), page 336
note: "Codebook label: Which of these statements applies to you? CODE ONE ONLY. Codebook notes: Card A1.2b contained responses 1-4. See POSSLQ."
variant_of:
  posslq: "the Y form of the X/Y wording experiment: option 2 reads 'steady partner' for 'living as married'"
