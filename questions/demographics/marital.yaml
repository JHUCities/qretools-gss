name: marital
title: Marital status
text: Are you currently married, widowed, divorced, separated, or have you never been married?
intent: Marital and partnership status, as the GSS Replicating Core measures it (MARITAL).
concept: marital_status
responses:
  "1": Married
  "2": Widowed
  "3": Divorced
  "4": Separated
  "5": Never married
source: GSS MARITAL; GSS 2022 codebook (NORC), page 122
note: "Codebook label: Are you currently married, widowed, divorced, separated, or have you never been married?"
