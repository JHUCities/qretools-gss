name: marital
title: Marital status
text: Are you currently--married, widowed, divorced, separated, or have you never been married?
intent: Marital and partnership status, as the GSS Replicating Core measures it (MARITAL).
concept: marital_status
responses:
  "1": Married
  "2": Widowed
  "3": Divorced
  "4": Separated
  "5": Never married
source: GSS MARITAL; GSS 1972-2018 cumulative codebook (NORC), page 135; asked in the 2008 survey
note: "Codebook wording: Are you currently--married, widowed, divorced, separated, or have you never been married?"
