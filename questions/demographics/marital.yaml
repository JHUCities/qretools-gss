name: marital
title: Marital status
text: Are you currently--married, widowed, divorced, separated, or have you never been married?
intent: "Marital status or cohabitation status, in the GSS Replicating Core: marital status (MARITAL)."
concept: marital_status
responses:
  "1": Married
  "2": Widowed
  "3": Divorced
  "4": Separated
  "5": Never married
source: GSS MARITAL, https://gssdataexplorer.norc.org/variables/18/vshow
note: "GSS documentation wording: Are you currently--married, widowed, divorced, separated, or have you never been married?"
