name: eth3
title: Ancestry, third country
text: From what countries or part of the world did your ancestors come?
intent: Ancestry, as the GSS Replicating Core measures it (ETH3).
concept: ethnicity
responses: ancestry
source: GSS ETH3; GSS 1972-2018 cumulative codebook (NORC), page 2937; asked in the 2008 survey
note: "Codebook stem: From what countries or part of the world did your ancestors come? Codebook wording: THIRD ETHNICITY MENTIONED"
variant_of:
  eth1: the third country mentioned in answer to the same question
  eth2: the third country mentioned, where eth2 is the second
