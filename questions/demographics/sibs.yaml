name: sibs
title: Number of siblings
text: How many brothers and sisters did you have? Please count those born alive, but no longer living, as well as those alive now. Also include stepbrothers and stepsisters, and children adopted by your parents.
intent: Number of siblings, as the GSS Replicating Core measures it (SIBS).
concept: siblings
number:
  min: 0
source: GSS SIBS; GSS 2022 codebook (NORC), page 144
note: "Codebook label: How many brothers and sisters did you have? Please count those born alive, but no longer living, as well as those  alive now. Also include stepbrothers and stepsisters, and children adopted by your parents. Codebook notes: If planning to perform trend analysis with this variable, please consult GSS Methodological Report No. 56. The response categories have been collapsed for convenience of display."
