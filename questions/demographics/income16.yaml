name: income16
title: Family income, 26 groups
text: In which of these groups did your total family income, from all sources, fall last year? That is, before taxes.
intent: Family income, as the GSS Replicating Core measures it (INCOME16).
concept: household_income
responses: income_26
source: GSS INCOME16; GSS 2022 codebook (NORC), page 176
note: "Codebook label: In which of these groups did your total family income, from all sources, fall last year? That is, before taxes. Codebook notes: Showcard A20 reads: Total income includes interest or dividends, rent, Social Security, other pension, alimony or child support, unemployment compensation, public aid (welfare), armed forces or veteran’s allotment. INCOME16 was most recently updated in 2016."
variant_of:
  income: the 26-category version of the family income question
