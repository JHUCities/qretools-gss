name: agekdbrn
title: R's age when 1st child born
text: How old were you when your first child was born?
intent: "Age at birth of first child, in the GSS Replicating Core: r's age when 1st child born (AGEKDBRN)."
concept: age_at_first_birth
number:
  min: 0
  unit: years
source: GSS AGEKDBRN, https://gssdataexplorer.norc.org/variables/54/vshow
note: "GSS documentation wording: How old were you when your first child was born? As of 2024, AGEKDBRN has been recoded to only account for first child born during ages 18-45. This has been retroactively applied to all previous years of AGEKDBRN. The original AGEKDBRN containing data from 1994 to 2022 has been renamed AGEKDBRN_9422. Released data label: 17 and younger; 45 and older."
