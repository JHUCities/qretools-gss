name: spklang
title: How well the other language is spoken
text: How well do you speak that language?
intent: Languages spoken, as the GSS Replicating Core measures it (SPKLANG).
concept: language
universe: other_language_speakers
responses:
  "1": Very well
  "2": Well
  "3": Not well
  "4": Poorly/Hardly at all
instruction: IF SPEAKS 2 OR MORE, ASK ONLY OF THE MOST FLUENT LANGUAGE
source: GSS SPKLANG; GSS 1972-2018 cumulative codebook (NORC), page 1296; asked in the 2008 survey
note: "Codebook wording: How well do you speak that language? [IF SPEAKS 2 OR MORE, ASK ONLY OF THE MOST FLUENT LANGUAGE] READ CATEGORIES"
