name: hrs2
title: Usual hours of work
text: How many hours a week do you usually work, at all jobs?
intent: Time worked, as the GSS Replicating Core measures it (HRS2).
concept: labor_supply
universe: with_job_not_at_work
number:
  min: 0
  unit: hours
source: GSS HRS2; GSS 1972-2018 cumulative codebook (NORC), page 124; asked in the 2008 survey
note: "Codebook stem: Last week were you working full time, part time, going to school, keeping house, or what? CIRCLE ONE CODE ONLY. IF MORE THAN ONE RESPONSE, GIVE PREFERENCE TO SMALLEST CODE NUMBER THAT APPLIES Codebook wording: IF WITH A JOB, BUT NOT AT WORK: How many hours a week do you usually work, at all jobs?"
