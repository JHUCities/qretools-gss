name: weekswrk
title: Weeks worked last year
text: Now I'd like to ask you about last year. In {{last_year}} how many weeks did you work either full-time or part-time not counting work around the house--include paid vacations and sick leave?
intent: Time worked, as the GSS Replicating Core measures it (WEEKSWRK).
concept: labor_supply
