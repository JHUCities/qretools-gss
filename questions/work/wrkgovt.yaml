name: wrkgovt
title: Govt or private employee
text: (Are/Were) you employed by the federal, state or local government or by a private employer (including non-profit organizations)?
intent: "Private or public sector, in the GSS Replicating Core: govt or private employee (WRKGOVT)."
concept: sector
responses:
  "1": Government
  "2": Private
source: GSS WRKGOVT, https://gssdataexplorer.norc.org/variables/10/vshow
note: "GSS documentation wording: A. What kind of work do you (did you normally) do? That is, what (is/was) your job called? OCCUPATION: [See REMARKS] B. What (do/did) you actually do in that job? Tell me, what (are/were) some of your main duties? C. What kind of place (do/did) you work for? INDUSTRY: [See REMARKS] D. What (do/did) they (make/do)? E. (Are/Were) you self employed or (do/did) you work for someone else? F. (Are/Were) you employed by the federal, state or local government or by a private employer (including non-profit organizations)? G. About how much time (does/did) it usually take you to travel to work - about how many minutes?"
