name: partfull
title: Full or part time last year
text: When you worked in {{last_year}}, was it usually full or part time?
intent: Time worked, as the GSS Replicating Core measures it (PARTFULL).
concept: labor_supply
responses:
  "1": Full-time
  "2": Part-time
source: GSS PARTFULL; GSS 1972-2018 cumulative codebook (NORC), page 438; asked in the 2008 survey
note: "Codebook stem: Now I'd like to ask you about last year. In [the previous year] how many weeks did you work either full-time or part-time not counting work around the house--include paid vacations and sick leave? Codebook wording: When you worked in [the previous year], was it usually full or part time?"
fills:
  last_year: number
