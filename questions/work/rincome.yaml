name: rincome
title: Earnings from work, 12 groups
text: In which of these groups did your earnings from {{job}} for last year--{{last_year}}--fall? That is, before taxes or other deductions.
intent: Earnings from work, as the GSS Replicating Core measures it (RINCOME).
concept: income_from_occupation
responses: income_12
source: GSS RINCOME; GSS 1972-2018 cumulative codebook (NORC), page 217; asked in the 2008 survey
note: "Codebook wording: Did you earn any income from (OCCUPATION DESCRIBED IN OCC-INDUSTRY) in [the previous year]? Yes ............. (ASK RINCOME) No .............. [See REMARKS] A. IF YES: In which of these groups did your earnings from (OCCUPATION IN OCC) for last year--[the previous year]--fall? That is, before taxes or other deductions. Just tell me the letter."
fills:
  job: text
  last_year: text
