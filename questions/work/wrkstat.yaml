name: wrkstat
title: Work status last week
text: Last week were you working full time, part time, going to school, keeping house, or what?
intent: Work status, as the GSS Replicating Core measures it (WRKSTAT).
concept: employment_status
responses:
  "1": Working full time
  "2": Working part time
  "3": With a job, but not at work because of temporary illness, vacation, strike
  "4": Unemployed, laid off, looking for work
  "5": Retired
  "6": In school
  "7": Keeping house
  "8": Other
source: GSS WRKSTAT; GSS 1972-2018 cumulative codebook (NORC), page 122; asked in the 2008 survey
note: "Codebook wording: Last week were you working full time, part time, going to school, keeping house, or what? CIRCLE ONE CODE ONLY. IF MORE THAN ONE RESPONSE, GIVE PREFERENCE TO SMALLEST CODE NUMBER THAT APPLIES"
