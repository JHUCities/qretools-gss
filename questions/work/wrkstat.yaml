name: wrkstat
title: Work status last week
text: Last week were you working full time, part time, going to school, keeping house, or what?
intent: Work status, as the GSS Replicating Core measures it (WRKSTAT).
concept: employment_status
responses:
  "1": Working full time
  "2": Working part time
  "3": With a job, but not at work because of temporary illness, vacation, strike
  "4": Unemployed, laid off, looking for work
  "5": Retired
  "6": In school
  "7": Keeping house
  "8": Other
source: GSS WRKSTAT; GSS 2022 codebook (NORC), page 108
note: "Codebook label: Last week were you working full time, part time, going to school, keeping house, or what? Codebook notes: Card A2 contained responses for punches 1 through 7. Contents of WRKSTAT, punch 8 (Other, SPECIFY) available from NORC."
