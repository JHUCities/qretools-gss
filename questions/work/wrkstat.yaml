name: wrkstat
title: Labor force status
text: Last week were you working full time, part time, going to school, keeping house, or what?
intent: "Employment status, in the GSS Replicating Core: labor force status (WRKSTAT)."
concept: employment_status
responses:
  "1": Working full time
  "2": Working part time
  "3": With a job, but not at work because of temporary illness, vacation, strike
  "4": Unemployed, laid off, looking for work
  "5": Retired
  "6": In school
  "7": Keeping house
  "8": Other
source: GSS WRKSTAT, https://gssdataexplorer.norc.org/variables/3/vshow
note: "GSS documentation wording: Last week were you working full time, part time, going to school, keeping house, or what?"
