name: evwork
title: Ever worked for a year
text: Did you ever work for as long as one year?
intent: Work status, as the GSS Replicating Core measures it (EVWORK).
concept: employment_status
universe: not_in_labor_force
responses: yes_no
source: GSS EVWORK; GSS 1972-2018 cumulative codebook (NORC), page 124; asked in the 2008 survey
note: "Codebook stem: Last week were you working full time, part time, going to school, keeping house, or what? CIRCLE ONE CODE ONLY. IF MORE THAN ONE RESPONSE, GIVE PREFERENCE TO SMALLEST CODE NUMBER THAT APPLIES Codebook wording: IF RETIRED, IN SCHOOL, KEEPING HOUSE, OR OTHER: Did you ever work for as long as one year?"
